[package]
name = "krateus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Os benchmarks vivem em benches/pool.rs, sob o harness do Criterion. Sem isto,
# `cargo bench` sem `--bench` tambem seleciona o harness libtest da biblioteca,
# que recebe as flags do Criterion e falha. Desligar aqui torna o comportamento
# seguro mesmo que o comando do CI seja simplificado depois.
[lib]
bench = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# O criterion fica atras de feature, e nao como dev-dependency, de proposito:
# ele puxa `zerocopy`, cujo build script e bloqueado pelo Smart App Control
# (R01). Como dev-dependency, quebraria `cargo test` local. Assim, o fluxo
# local segue funcionando e o CI Linux roda os benchmarks com --features bench.
[dependencies.criterion]
workspace = true
optional = true

[features]
bench = ["dep:criterion"]

[[bench]]
name = "pool"
harness = false
required-features = ["bench"]
