# Configuracao do cargo-deny. Roda apenas no CI Linux (ver R01 em docs/RISCOS.md).

[licenses]
# A engine e MIT OR Apache-2.0; dependencias precisam ser compativeis com isso.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Versoes duplicadas da mesma crate incham o binario e o tempo de compilacao,
# que e exatamente o que a secao 11 do documento de visao quer evitar. Comeca
# como aviso: no inicio do projeto a arvore ainda esta se acomodando.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
